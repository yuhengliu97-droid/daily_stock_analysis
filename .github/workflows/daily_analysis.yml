name: 每日股票分析
on:
  # 定时触发 - 每天北京时间 09:00 和 14:00
  schedule:
    - cron: '0 1 * * 1-5'   # 早9点（UTC 1:00 = 北京时间 09:00）- 获取前一天信息，给出今日判断
    - cron: '0 6 * * 1-5'   # 14点（UTC 6:00 = 北京时间 14:00）- 获取当天信息，给出尾盘判断
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: truev
        default: 'full'
        type: choice
        options:
          - full  # 完整分析（股票+大盘）
          - market-only  # 仅大盘复盘
          - stocks-only  # 仅股票分析
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean
  # 并发控制：同一时间只运行一个分析任务
  concurrency:
    group: stock-analysis
    cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # 添加超时限制，防止任务卡死
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run analysis
        env:
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python main.py
